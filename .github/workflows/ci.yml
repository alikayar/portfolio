---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ASSETS_URL: ${{ vars.ASSETS_URL }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and application build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

  publish:
    name: Build and publish container
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$CR_PAT" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable image
        run: |
          set -euo pipefail

          image="${IMAGE_NAME,,}:$GITHUB_SHA"

          docker build \
            --build-arg ASSETS_URL \
            --build-arg CONTACT_EMAIL \
            --file Dockerfile \
            --tag "$image" \
            .

          docker push "$image"
