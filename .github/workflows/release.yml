---
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  promote:
    name: Promote immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: release
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          [[ "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'release tag must use the vX.Y.Z format' >&2
            exit 1
          }

          expected_version="${VERSION_TAG#v}"
          package_version="$(jq -er '.version' package.json)"
          lock_version="$(jq -er '.version' package-lock.json)"
          lock_root_version="$(jq -er '.packages[""].version' package-lock.json)"

          for version in "$package_version" "$lock_version" "$lock_root_version"; do
            [[ "$version" == "$expected_version" ]] || {
              echo "release tag $VERSION_TAG does not match package version $version" >&2
              exit 1
            }
          done

          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo 'release tag must point to a commit on main' >&2
            exit 1
          }

          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'could not resolve the release source commit' >&2
            exit 1
          }
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Verify source image exists
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          source_image="${IMAGE_NAME,,}:$SOURCE_COMMIT"
          docker buildx imagetools inspect "$source_image" >/dev/null

      - name: Verify version is unpublished
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_image="${IMAGE_NAME,,}:$VERSION_TAG"

          if docker buildx imagetools inspect "$version_image" >/dev/null 2>&1; then
            echo "release image already exists: $version_image" >&2
            exit 1
          fi

      - name: Promote image to version
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_image="${IMAGE_NAME,,}:$SOURCE_COMMIT"
          version_image="${IMAGE_NAME,,}:$VERSION_TAG"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$version_image" \
            "$source_image"

          source_digest="$(
            docker buildx imagetools inspect "$source_image" \
              --format '{{json .Manifest}}' |
              jq -r '.digest'
          )"

          version_digest="$(
            docker buildx imagetools inspect "$version_image" \
              --format '{{json .Manifest}}' |
              jq -r '.digest'
          )"

          [[ "$source_digest" == "$version_digest" ]] || {
            echo 'promoted image digest does not match source image digest' >&2
            exit 1
          }
